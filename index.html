<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                        url("assets/clinic.png") no-repeat center center;
            background-size: cover;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.5rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .hero .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .hero .buttons a, .hero .buttons button {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.1rem;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .hero .buttons a:hover, .hero .buttons button:hover {
            background-color: #0056b3;
        }

        /* Login form overlay */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 8px;
            text-align: left;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .login-box label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        .login-box input, .login-box select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #0056b3;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            background-color: rgba(215, 215, 215, 0.733);
            color: rgb(255, 0, 0);
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 2rem;
            }
            .hero p {
                font-size: 1.1rem;
            }
            .hero .buttons a, .hero .buttons button {
                padding: 12px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<section class="hero">
    <h1>Welcome to Our Clinic</h1>
    <p>Manage doctors, patients, and appointments easily.</p>
    <div class="buttons">
        <button onclick="openLogin()">Login to Access</button>
    </div>
</section>

<!-- this is the login form -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h2>Login</h2>`
        <form method="POST" action="actions/auth/login.php">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter email" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>

            <label>Login As</label>
            <select name="role" required>
                <option value="admin">Admin</option>
                <option value="user">Staff</option>
            </select>

            <button type="submit" onclick()="">Login</button>
        </form>
        <button style="margin-top:10px; background:red;" onclick="closeLogin()">Cancel</button>
    </div>
</div>

<footer>
    &copy; 2025 Clinic Management System
</footer>

<script>
    function openLogin() {
        document.getElementById('loginOverlay').style.display = 'flex';
    }
    function closeLogin() {
        document.getElementById('loginOverlay').style.display = 'none';
    }
</script>

</body>
</html>
